# ai-mcp.nsmall.com 전용 Apache 설정 (TLS 인증서 경로는 환경에 맞게 수정)
# 필요 모듈: mod_ssl, mod_proxy, mod_proxy_http, mod_headers
<VirtualHost *:443>
    ServerName ai-mcp.nsmall.com

    # SSLEngine on
    # SSLCertificateFile    /etc/httpd/ssl/nsmall.com.crt
    # SSLCertificateKeyFile /etc/httpd/ssl/nsmall.com.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60

    <Location "/mcp">
        ProxyPass        "http://127.0.0.1:3100/mcp"
        ProxyPassReverse "http://127.0.0.1:3100/mcp"
        <LimitExcept POST OPTIONS>
            Require all denied
        </LimitExcept>
        Header always set Cache-Control "no-store"
    </Location>

    <Location "/healthz">
        ProxyPass        "http://127.0.0.1:3100/healthz"
        ProxyPassReverse "http://127.0.0.1:3100/healthz"
        Header always set Cache-Control "no-store"
    </Location>
</VirtualHost>
