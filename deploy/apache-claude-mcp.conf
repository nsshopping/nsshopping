# 원본 서버가 Apache인 경우: image.nsmall.com의 <VirtualHost> 블록 안에 추가
# 필요 모듈: mod_proxy, mod_proxy_http, mod_headers
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60

<Location "/claude/mcp">
    ProxyPass        "http://127.0.0.1:3100/claude/mcp"
    ProxyPassReverse "http://127.0.0.1:3100/claude/mcp"
    <LimitExcept POST OPTIONS>
        Require all denied
    </LimitExcept>
    Header always set Cache-Control "no-store"
</Location>

<Location "/claude/healthz">
    ProxyPass        "http://127.0.0.1:3100/healthz"
    ProxyPassReverse "http://127.0.0.1:3100/healthz"
    Header always set Cache-Control "no-store"
</Location>
