# ai-mcp.nsmall.com 전용 Nginx 설정 (TLS 인증서 경로는 환경에 맞게 수정)
server {
    listen 443 ssl;
    server_name ai-mcp.nsmall.com;

    # ssl_certificate     /etc/nginx/ssl/nsmall.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/nsmall.com.key;

    location = /mcp {
        proxy_pass http://127.0.0.1:3100/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3100/healthz;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
